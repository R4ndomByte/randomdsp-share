<body><main><h1>Music Oracle</h1><p>Draw a genre. Make a song.</p><button id="share" disabled>Preparing image…</button><p id="status" role="status" aria-live="polite">Preparing your story…</p><canvas id="story" width="1080" height="1920" aria-label="Music challenge story preview"></canvas><button id="save" disabled>Save Image</button><details><summary>Customize your story</summary><label for="heading">Story title</label><input id="heading" maxlength="60"><label for="tag">Hashtag</label><input id="tag" maxlength="80"><label><input type="checkbox" id="showTag"> Show hashtag</label><label for="artist">Artist / @username</label><input id="artist" maxlength="60"><label for="note">Personal message</label><textarea id="note" maxlength="140" rows="3"></textarea><label for="theme">Theme</label><select id="theme"><option value="1">Traditional</option><option value="2">RandomE</option><option value="3">Minimal</option></select></details><p>RandomDSP · Your result is rendered on this device. No login required. Available destinations depend on your phone. If Instagram Stories is not offered, save the image and add it manually.</p></main><script src="story.js?v=1.1.1" defer></script></body></html>
