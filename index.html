<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Music Oracle — Share your fortune</title>
<style> *{box-sizing:border-box}body{margin:0;background:#211b19;color:#efdfc1;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:24px 18px 40px}h1{font-size:24px;margin:0 0 6px}p{line-height:1.5;color:#d0bfa6}canvas{display:block;width:min(100%,320px);height:auto;margin:20px auto;border:1px solid #9c8060}button{font:inherit;font-weight:600;padding:13px;border:1px solid #b99b71;border-radius:6px;background:#50372a;color:#fff0d4;cursor:pointer}button:disabled{opacity:.5;cursor:default}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:14px;margin:12px 0 4px}input,textarea,select{display:block;width:100%;font:inherit;background:#342922;color:#fff0d4;padding:10px;border:1px solid #80684e;border-radius:4px}input[type=checkbox]{display:inline;width:auto}details{margin:22px 0}summary{cursor:pointer}#status{min-height:3em;font-size:14px}a{color:#ecd3a1}</style></head>
<body><main><h1>Music Oracle</h1><p>Draw a genre. Make a song.</p><canvas id="story" width="1080" height="1920" aria-label="Music challenge story preview"></canvas><div class="actions"><button id="share" disabled>Share Story</button><button id="save" disabled>Save Story PNG</button></div><p id="status" role="status">Loading…</p><details><summary>Customize your story</summary><label for="heading">Story title</label><input id="heading" maxlength="60"><label for="tag">Hashtag</label><input id="tag" maxlength="80"><label><input type="checkbox" id="showTag"> Show hashtag</label><label for="artist">Artist / @username</label><input id="artist" maxlength="60"><label for="note">Personal message</label><textarea id="note" maxlength="140" rows="3"></textarea><label for="theme">Theme</label><select id="theme"><option value="1">Traditional</option><option value="2">RandomE</option><option value="3">Minimal</option></select></details><p>RandomDSP · Your result is rendered on this device. No login required. Instagram may not appear in your share menu; save the PNG and add it to Stories manually.</p></main><script src="story.js" defer></script></body></html>
